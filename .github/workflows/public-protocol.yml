name: Public protocol regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tasks/w1/requirements.txt -r tasks/c2/requirements.txt
      - run: |
          python -m unittest tests.test_codex_bench tests.test_public_protocol tasks.w1.tests.test_gateway tasks.c1.tests.test_c1_runner
          python scripts/summarize_audit.py
          git diff --exit-code -- docs/results/advanced-audit-20261127/dispersion.csv docs/results/advanced-audit-20261127/stage-deviations.csv
      - run: |
          docker build -f tasks/s1/Circuit.Dockerfile -t longworkmem-circuit:1 .
          S1_TEST_DOCKER=1 python -m unittest tasks.s1.tests.test_engine
      - run: |
          docker build -t longworkmem-calendar:1 -f tasks/c2/Dockerfile tasks/c2
          C2_TEST_ROOT="$RUNNER_TEMP" python -m unittest discover -s tasks/c2/tests -t . -v
          C2_TEST_ROOT="$RUNNER_TEMP" python -m unittest tasks.c2.evolution.tests.test_evolution -v
          C2_TEST_ROOT="$RUNNER_TEMP" python -m unittest tasks.c2.cohorts.tests.test_cohorts -v
      - run: |
          docker build -t longworkmem-office:1 -f tasks/w1/Office.Dockerfile .
          docker build -t longworkmem-release:1 -f tasks/w4/Release.Dockerfile tasks/w4
          W4_TEST_ROOT="$RUNNER_TEMP" python -m unittest discover -s tasks/w4/tests -t . -v
      - run: |
          docker build -t longworkmem-catan:1 tasks/s4
          S4_TEST_DOCKER=1 python -m unittest discover -v -s tasks/s4/tests -t .
